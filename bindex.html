<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="This page  made by bootstrap framework where is showing how to change homepage narrow-screen">
  <meta name="author" content="Md Nahid Hasan Rabbi">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <title>Super company</title>
  
 
</head>
<body class="js-responsive-design">
  <div class="container-fluid  pt-3 pb-2 text-bg-secondary text-bg-gradient" 
  >
    <h1 class="text-center">Super Company</h1>
    <p class=" text-center border-bottom pb-3" >Your trusted partner in business</p>
    <nav class="navbar navbar-expand ">
      <div class="container-fluid ">
        <ul class="navbar-nav ">
          <li class="nav-item "><a class="nav-link m-2 pb-2 bg-primary text-white rounded text-center " href="about.html"> About us</a>
           
          </li>
          <li class="nav-item "><a class="nav-link m-2 p-2 bg-primary text-white rounded text-center " href="offer.html"> Offer

          </a>
           
          </li>
          <li class="nav-item "><a class="nav-link m-2 p-2 bg-primary text-white rounded text-center " href="contact.html">Contact</a>
            
          </li>
        </ul>
      </div>
    </nav>
    <script>
        window.addEventListener('resize',()=>{
        Body=document.querySelector('.js-responsive-design')
      if(window.innerWidth<=720){
          Body.innerHTML=`
        <div class="container-fluid  pt-3 pb-4 text-bg-secondary text-bg-gradient" >
              <h1 class="text-center">Super Company</h1>
              <p class=" text-center border-bottom pb-3" >Your trusted partner in business</p>
          <nav class="navbar navbar-expand-md navbar-light bg-light">
            <div class="container">
                <button class="navbar-toggler" type="button"   data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
                </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">  
                  <li class="nav-item">
                    <a class="nav-link" href="about.html">About Us</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link active" href="offer.html">Offer</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                  </li>
                </ul>
              </div>
            </div>
        
          </nav>
        </div>`

      }else{
        Body.innerHTML=`  <div class="container-fluid  pt-3 pb-2 text-bg-secondary text-bg-gradient" >
    <h1 class="text-center">Super Company</h1>
    <p class=" text-center border-bottom pb-3" >Your trusted partner in business</p>
    <nav class="navbar navbar-expand ">
      <div class="container-fluid ">
        <ul class="navbar-nav ">
          <li class="nav-item "><a class="nav-link m-2 pb-2 bg-primary text-white rounded text-center " href="about.html"> About us</a>
           
          </li>
          <li class="nav-item "><a class="nav-link m-2 p-2 bg-primary text-white rounded text-center " href="offer.html"> Offer

          </a>
           
          </li>
          <li class="nav-item "><a class="nav-link m-2 p-2 bg-primary text-white rounded text-center " href="contact.html">Contact</a>
            
          </li>
        </ul>
      </div>
    </nav>

  </div>`
      }
      });
    </script>
  </body>
</html>
